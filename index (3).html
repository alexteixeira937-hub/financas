  return `<div class="modal-bg" data-act="close"><form class="modal wide" id="impform" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap;gap:12px"><div style="flex:1;min-width:0"><h3 id="mt" style="margin:0">Importar extrato</h3><p class="sub" style="margin:4px 0 0">Baixe o extrato no app ou site do banco em <b>OFX</b> (melhor) ou <b>CSV</b>. Nada sai do seu aparelho.</p></div><button type="button" class="iconbtn" data-act="close" aria-label="Fechar">${ic("x")}</button></div>
  <div class="fields">${fld("De qual conta ou cartão é o extrato?",`<select class="in" id="imp-dest" data-m="dest" data-rerender="1">${dests.map(d=>`<option value="${d[0]}"${d[0]===dest?" selected":""}>${esc(d[1])}</option>`).join("")}</select>`)}${fld("Arquivo",`<input class="in" type="file" id="imp-file" accept=".ofx,.csv,.txt,.OFX,.CSV">`)}</div>
  ${t.erro?`<div class="note warn">${ic("alert")}<span class="t">${esc(t.erro)}</span></div>`:""}${t.nome?`<div class="sub">${esc(t.nome)}</div>`:""}${body}
  <div class="acts"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary"${t.rows&&t.sel&&t.sel.length?"":" disabled"}>${ic("check")}Importar ${t.sel&&t.sel.length?t.sel.length:""} lançamentos</button></div></form></div>`}
/* ---------- pode gastar hoje ---------- */
function podeHoje(){const dim=dimK(CUR),today=TODAY.getDate(),rest=dim-today+1;const meta=+S.metaGasto||0;
  if(meta>0){const its=gastosVar(CUR);const antes=round2(sum(its.filter(i=>i.day<today).map(i=>i.value))),hoje=round2(sum(its.filter(i=>i.day===today).map(i=>i.value)));const base=Math.max(0,meta-antes)/rest;return{v:round2(base-hoje),base:round2(base),hoje,modo:"limite"}}
  if(S.contas.length){const fm=fimDoMes();if(fm){const base=Math.max(0,fm.fim)/rest;return{v:round2(base),base:round2(base),hoje:0,modo:"sobra"}}}
  return null}
function podeHojeChip(){if(UI.mk!==CUR)return"";const p=podeHoje();if(!p)return"";
  return `<button class="phoje ${p.v<0||p.base<=0?"bad":p.v<p.base*0.25?"warn":""}" data-act="phinfo" title="${p.modo==="limite"?"Limite do dia a dia dividido pelos dias que faltam, menos o que já gastou hoje":"Sobra prevista do mês dividida pelos dias que faltam"}">${p.base<=0&&p.v<=0?(p.modo==="limite"?"Limite do mês já foi usado":"Sem folga no mês"):p.v<0?`Hoje passou <b class="num">${brl(-p.v)}</b> do ideal`:`Pode gastar hoje <b class="num">${brl(p.v)}</b>`}</button>`}

function cmpModal(m){const A=m.a||CUR,B=m.b||addM(CUR,-1);const type=m.tp||"despesa";const da=monthData(A),db=monthData(B);const la=type==="despesa"?da.desp:da.rec,lb=type==="despesa"?db.desp:db.rec;

function pendencias(){const lim=isoD(new Date(TODAY.getFullYear(),TODAY.getMonth()-5,1));const L=S.tx.filter(t=>t.date>=lim&&t.date<=isoD(new Date(TODAY.getTime()+31*864e5)));

  const lim2=isoD(new Date(TODAY.getFullYear(),TODAY.getMonth()-1,1));const semConta=S.contas.length?L.filter(t=>t.date>=lim2&&t.type==="despesa"&&(!t.pay||t.pay==="conta")&&!t.semSaldo&&!(t.conta&&S.contas.some(c=>c.id===t.conta))):[];
  const seen={};const dups=[];L.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(t=>{if(t.notDup)return;const k=t.type+"|"+t.date+"|"+(+t.value).toFixed(2)+"|"+normN(t.desc);if(seen[k])dups.push({a:seen[k],b:t});else seen[k]=t});
  return{semCat,semConta,dups,n:semCat.length+semConta.length+dups.length}}
function cRevisao(){const P=pendencias();if(!P.n)return"";const ch=(n,l)=>n?`<span class="pill warn xs">${n} ${l}</span>`:"";
  return `<div class="card revc"><div class="revh"><span class="cic" style="--c:var(--warn)">${ic("check")}</span><span class="n"><b>Revisão rápida</b><small>Arrume em poucos toques para os números ficarem certos.</small></span><span class="revch">${ch(P.semCat.length,"sem categoria")}${ch(P.semConta.length,"sem conta")}${ch(P.dups.length,P.dups.length===1?"possível duplicado":"possíveis duplicados")}</span><button class="btn sm primary" data-act="rev">Revisar</button></div></div>`}
function revModal(){const P=pendencias();const dd=x=>pad(+x.slice(8,10))+"/"+x.slice(5,7);
  const it=(t,extra)=>`<div class="revrow"><span class="n"><b>${esc(t.desc)}</b><small>${dd(t.date)} · ${t.type==="receita"?"receita":"despesa"}${t.pay&&t.pay!=="conta"?" · cartão":""}</small></span><b class="num${t.type==="receita"?" pos":""}">${brl(t.value)}</b>${extra}</div>`;
  let h="";
  if(P.semCat.length)h+=`<div class="mini-h">Sem categoria (${P.semCat.length})</div>${P.semCat.slice(0,30).map(t=>it(t,`<select class="in sm" data-revcat="${t.id}" aria-label="Categoria de ${esc(t.desc)}">${catOpts(t.type,"")}</select>`)).join("")}`;
  if(P.semConta.length)h+=`<div class="mini-h">De qual conta saiu? (${P.semConta.length})</div>${P.semConta.slice(0,30).map(t=>it(t,`<select class="in sm" data-revconta="${t.id}" aria-label="Conta de ${esc(t.desc)}"><option value="">Escolher…</option>${S.contas.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}<option value="__so">Só registrar (não mexe no saldo)</option></select>`)).join("")}`;
  if(P.dups.length)h+=`<div class="mini-h">Possíveis duplicados (${P.dups.length})</div><div class="sub" style="margin-bottom:6px">Mesmo dia, mesmo valor e mesma descrição, lançados duas vezes.</div>${P.dups.slice(0,20).map(x=>it(x.b,`<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm ghost" data-act="revnotdup" data-id="${x.b.id}">Não é</button><button class="btn sm" data-act="revdel" data-id="${x.b.id}">${ic("trash")}Apagar</button></span>`)).join("")}`;
  return `<div class="modal-bg" data-act="close"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap;gap:12px"><div><h3 id="mt" style="margin:0">Revisão rápida</h3><p class="sub" style="margin:4px 0 0">Cada escolha já fica salva.</p></div><button class="iconbtn" data-act="close" aria-label="Fechar">${ic("x")}</button></div>${P.n?`<div class="revlist">${h}</div>`:`<div class="note good">${ic("check")}<span class="t">Tudo revisado. Bom trabalho!</span></div>`}<div class="acts"><button class="btn primary" data-act="close">Pronto</button></div></div></div>`}

const MOEDAS=[["BRL","R$","Real"],["USD","US$","Dólar americano"],["EUR","€","Euro"],["GBP","£","Libra"],["ARS","AR$","Peso argentino"],["CLP","CL$","Peso chileno"],["UYU","UY$","Peso uruguaio"],["PYG","₲","Guarani"],["PEN","S/","Sol peruano"],["COP","CO$","Peso colombiano"],["MXN","MX$","Peso mexicano"],["CAD","CA$","Dólar canadense"],["JPY","¥","Iene"],["CHF","CHF","Franco suíço"]];
const moSym=m=>(MOEDAS.find(x=>x[0]===m)||[m,m])[1];
const fmtMo=(v,m)=>PRIV?moSym(m)+" •••":moSym(m)+" "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const parseRate=x=>{x=String(x==null?"":x).trim().replace(/[R$\s]/g,"");if(!x)return 0;if(x.indexOf(",")>=0)x=x.replace(/\./g,"").replace(",",".");const n=parseFloat(x);return isFinite(n)&&n>0?n:0};
const fmtRate=v=>v>0?(+v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:4}):"";
const IOF_CARTAO=0.035;
async function cotacao(m){if(!m||m==="BRL")return 1;let C={};try{C=JSON.parse(localStorage.getItem("mf-cot")||"{}")}catch(_){}const c=C[m];if(c&&Date.now()-c.at<6*36e5)return c.v;
  let v=0;try{const r=await fetch(`https://economia.awesomeapi.com.br/json/last/${m}-BRL`);const j=await r.json();v=parseFloat((j[m+"BRL"]||{}).bid)||0}catch(_){}
  if(!v){try{const r=await fetch(`https://open.er-api.com/v6/latest/${m}`);const j=await r.json();v=+(j.rates&&j.rates.BRL)||0}catch(_){}}
  if(v>0){C[m]={v,at:Date.now()};try{localStorage.setItem("mf-cot",JSON.stringify(C))}catch(_){}}return v}
function fxCalc(t){const k=t.type==="despesa"&&!!cardById(t.pay);const iof=k&&t.iof!==false?IOF_CARTAO:0;return round2((parseBR(t.vorig)||+t.vorig||0)*parseRate(t.cot)*(1+iof))}
function fxSync(){const m=UI.modal;if(!m||m.type!=="tx")return;readModal();const t=m.t;const v=fxCalc(t);const e=document.getElementById("tx-fxr");if(v>0){t.value=v;const vi=document.getElementById("tx-val");if(vi)vi.value=moneyIn(v)}
  if(e)e.innerHTML=v>0?`= <b class="num">${brl(v)}</b>${t.type==="despesa"&&cardById(t.pay)&&t.iof!==false?" com IOF de 3,5%":""}`:(t.cotSt==="busca"?"Buscando a cotação de hoje…":parseRate(t.cot)?"Digite o valor":"Digite a cotação (não consegui buscar agora)")}
function fxFetch(){const m=UI.modal;if(!m||m.type!=="tx")return;const t=m.t;const mo=t.moeda;if(!mo||mo==="BRL")return;t.cotSt="busca";fxSync();
  cotacao(mo).then(v=>{const mm=UI.modal;if(!mm||mm.type!=="tx"||mm.t.moeda!==mo)return;mm.t.cotSt=v>0?"ok":"erro";if(v>0&&!mm.t.cotManual){mm.t.cot=fmtRate(v);const ci=document.getElementById("tx-cot");if(ci)ci.value=mm.t.cot}fxSync();const st=document.getElementById("tx-cotst");if(st)st.textContent=v>0?"· hoje":"· digite"})}
function txMoedaHTML(t,isCard){if(t.type!=="despesa"&&!t.moeda)return"";if(!t.moeda||t.moeda==="BRL")return `<button type="button" class="lnk fxlnk" data-act="txmoeda">${ic("coins")}Gasto em outra moeda</button>`;
  return `<div class="fxbox"><div class="fields fx3">${fld("Moeda",`<select class="in" id="tx-moeda" data-m="moeda">${MOEDAS.map(x=>`<option value="${x[0]}"${x[0]===t.moeda?" selected":""}>${x[0]==="BRL"?"Real (voltar)":x[1]+" · "+x[2]}</option>`).join("")}</select>`)}${fld("Valor em "+moSym(t.moeda),`<input class="in money" id="tx-vorig" data-m="vorig" data-kind="money" inputmode="decimal" placeholder="0,00" value="${+t.vorig?moneyIn(+t.vorig):""}">`)}${fld(`Cotação <small class="sub" id="tx-cotst" style="font-weight:400">${t.cotSt==="busca"?"buscando…":t.cot?"":"digite"}</small>`,`<input class="in money" id="tx-cot" data-m="cot" inputmode="decimal" placeholder="5,40" value="${esc(t.cot?fmtRate(parseRate(t.cot)):"")}">`)}</div>

function vzStatus(v){const h=hojeIso();if(v.ini&&h<v.ini)return"prox";if(v.ini&&(!v.fim||h<=v.fim)&&h>=v.ini)return v.fim?"and":"feita";return"feita"}
function vzAtiva(){return (S.viagens||[]).find(v=>v.ini&&v.fim&&hojeIso()>=v.ini&&hojeIso()<=v.fim)}
function vzInfo(v){const T=tagData(v.tag);const teto=+v.teto||0;const st=vzStatus(v);const ini=v.ini||T.ini,fim=v.fim||T.fim;
  const dias=ini&&fim?Math.round((Date.parse(fim)-Date.parse(ini))/864e5)+1:T.dias;const resta=round2(teto-T.total);
  const diasRest=st==="and"?Math.round((Date.parse(v.fim)-Date.parse(hojeIso()))/864e5)+1:0;

  const antes=v.ini?round2(sum(T.D.filter(t=>t.date<v.ini).map(t=>+t.value||0))):0;const destino=round2(T.total-antes);
  const porCat={};T.D.forEach(t=>{porCat[t.cat||""]=(porCat[t.cat||""]||0)+(+t.value||0)});
  const orc=Object.keys(v.orc||{}).filter(k=>+v.orc[k]>0).map(k=>{const ci=catInfo("despesa",k);const g=round2(porCat[k]||0);return{id:k,name:ci.name,color:ci.color,orc:+v.orc[k],g,p:g/(+v.orc[k])}}).sort((a,b)=>b.orc-a.orc);
  const mo=v.moeda&&v.moeda!=="BRL"?v.moeda:"";const vMo=mo?round2(sum(T.D.filter(t=>t.moeda===mo).map(t=>+t.vorig||0))):0;
  return{T,teto,st,ini,fim,dias,resta,diasRest,porDia:dias>0?destino/dias:0,meta,mi,em,p:teto>0?T.total/teto:0,antes,destino,orc,mo,vMo}}
const VZST={prox:"Próxima",and:"Em andamento",feita:"Feita"};
function vzDatas(i){const f=x=>pad(+x.slice(8,10))+"/"+x.slice(5,7)+"/"+x.slice(2,4);return i.ini?(i.fim&&i.fim!==i.ini?f(i.ini)+" a "+f(i.fim):f(i.ini)):"sem datas"}
function vzMeter(i){if(!(i.teto>0))return"";const cls=i.p>1?"bad":i.p>=.85?"warn":"good";return `<div class="meter vzm"><i class="${cls}" style="width:${Math.min(100,i.p*100)}%"></i></div>`}
function vzCard(v,big){const i=vzInfo(v);const tx=i.teto>0?(i.resta>=0?`Sobram <b class="num">${brl(i.resta)}</b> do teto`+(i.st==="and"&&i.diasRest>0?` · <b class="num">${brl(i.resta/i.diasRest)}</b> por dia até a volta`:""):`Passou <b class="num neg">${brl(-i.resta)}</b> do teto`):(i.T.total>0?"Sem teto definido":"Nenhum gasto etiquetado ainda");

  const mt=gar?gar:i.meta?`<div class="vzmeta">${ic("target")}<span>Meta <b>${esc(i.meta.name)}</b>: guardado <b class="num">${brl(i.mi.atual)}</b> de ${brl(i.mi.alvo)}</span><div class="meter"><i style="width:${Math.min(100,i.mi.p*100)}%;background:${i.mi.p>=1?"var(--good)":"var(--p1)"}"></i></div></div>`:"";

  <div class="vzv"><b class="num">${brl(i.T.total)}</b>${i.teto>0?`<small>de ${brl(i.teto)} (${pct0(i.p)})</small>`:""}</div>${vzMeter(i)}<div class="sub vzt">${tx}</div>${i.antes>0&&i.st!=="prox"?`<div class="vzsplit"><span><small>Pago antes</small><b class="num">${brl(i.antes)}</b></span><span><small>No destino</small><b class="num">${brl(i.destino)}</b></span>${i.dias>0&&i.destino>0?`<span><small>Por dia lá</small><b class="num">${brl(i.porDia)}</b></span>`:""}</div>`:""}${i.vMo>0?`<div class="sub vzt">${ic("coins")} ${fmtMo(i.vMo,i.mo)} gastos em ${esc((MOEDAS.find(x=>x[0]===i.mo)||[])[2]||i.mo).toLowerCase()}</div>`:""}${i.orc.length?`<div class="vzorc">${i.orc.map(o=>`<div class="vzo${o.p>1?" bad":o.p>=.85?" warn":""}"><span class="n">${esc(o.name)}</span><span class="meter"><i style="width:${Math.min(100,o.p*100)}%"></i></span><span class="num">${brlC(o.g)} <small>/ ${brlC(o.orc)}</small></span></div>`).join("")}</div>`:""}${mt}

function parcelados(cards,Rk){
  const ids=cards.map(c=>c.id);const out=[];
  S.tx.forEach(t=>{const n=parseInt(t.parc,10)||1;if(t.type!=="despesa"||n<2||ids.indexOf(t.pay)<0)return;const k=cardById(t.pay);if(!k)return;
    const start=faturaKey(t.date,k),end=addM(start,n-1),idx=monthsBetween(start,Rk)+1,val=round2((+t.value||0)/n);
    const st=idx>n?"fim":idx<1?"futura":"ativa";const pagas=Math.max(0,Math.min(n,idx-1));
    out.push({t,k,n,start,end,idx,val,st,pagas,rest:st==="fim"?0:round2(val*(n-Math.max(idx,1)+1)),total:+t.value||0});});
  return out.sort((a,b)=>a.st===b.st?a.end.localeCompare(b.end):a.st==="ativa"?-1:b.st==="ativa"?1:a.st==="futura"?-1:1);
}

function toCSV(d){return "﻿"+[d.head].concat(d.rows).map(r=>r.map(csvCell).join(";")).join("\r\n")}
function toPrintHTML(d){return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(d.title)}</title><style>body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#101828;margin:32px;font-size:12px}h1{font-size:20px;margin:0}p{color:#667085;margin:4px 0 16px}table{width:100%;border-collapse:collapse}th,td{padding:4px 8px;border-bottom:1px solid #e5e8ef;text-align:left;font-variant-numeric:tabular-nums}th{font-size:11px;color:#667085;text-transform:uppercase}.tot{display:flex;gap:24px;flex-wrap:wrap;margin:0 0 16px}.tot div b{display:block;font-size:14px}@media print{body{margin:10mm}}</style></head><body><h1>${esc(d.title)}</h1><p>${esc(d.per)} · gerado em ${esc(new Date().toLocaleString("pt-BR"))}</p>${d.totals.length?`<div class="tot">${d.totals.map(t=>`<div>${esc(t[0])}<b>${esc(t[1])}</b></div>`).join("")}</div>`:""}<table><thead><tr>${d.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${d.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table><script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>`}
async function saveFile(name,data,type){
  if(LOCAL){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}
  try{const dl=await window.claude.use("downloads");if(!dl)return false;await dl.save({filename:name,data});return true}catch(e){return false}
}
async function doShare(kind,btn){
  const m=UI.modal.t;const d=shData(m.what,+m.n,m.card||"");const say=t=>{if(btn){const o=btn.innerHTML;btn.textContent=t;setTimeout(()=>{btn.innerHTML=o},2200)}};
  if(!d.rows.length&&!d.text){say("Nada no período");return}
  if(kind==="csv"){
    const f=d.fname+".csv",csv=toCSV(d);
    try{const file=new File([csv],f,{type:"text/csv"});if(LOCAL&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:d.title});say("Compartilhado");return}}catch(e){if(e&&e.name==="AbortError")return}
    say(await saveFile(f,csv,"text/csv")?"Planilha baixada":"Não foi possível");return}
  if(kind==="texto"){
    try{if(LOCAL&&navigator.share){await navigator.share({title:d.title,text:d.text});say("Compartilhado");return}}catch(e){if(e&&e.name==="AbortError")return}
    try{await navigator.clipboard.writeText(d.text);say("Texto copiado")}catch(e){say("Não deu para copiar")}return}
  if(kind==="copiar"){try{await navigator.clipboard.writeText(d.text);say("Texto copiado")}catch(e){say("Não deu para copiar")}return}
  if(kind==="pdf"){
    if(d.visual){await abrirRecap(d.X,btn);say("Abrindo para salvar em PDF");return}
    if(LOCAL){const w=window.open("","_blank");if(w){w.document.open();w.document.write(toPrintHTML(d));w.document.close();say("Abrindo para salvar em PDF");return}}
    say(await saveFile(d.fname+".html",toPrintHTML(d),"text/html")?"Relatório baixado (abra e imprima)":"Não foi possível");return}
}

document.addEventListener("keydown",e=>{if((e.key==="n"||e.key==="N")&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!UI.modal&&!UI.drawer){const tg=e.target;if(!(tg&&(tg.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)))){e.preventDefault();const b=document.querySelector('header [data-act="newtx"]')||document.querySelector('[data-act="newtx"]');if(b)b.click();return}}if(e.key==="Escape"&&UI.modal){UI.modal=null;render()}else if(e.key==="Escape"&&UI.drawer){UI.drawer=null;render()}
  if(e.key==="Enter"&&e.target&&e.target.id==="tx-newname"){e.preventDefault();doTxNew();return}
  if(e.key==="Enter"&&e.target&&e.target.id==="lf-q"){e.preventDefault();lfParse(e.target.value);render();const x=document.getElementById("lf-q");if(x){x.focus();const n=x.value.length;try{x.setSelectionRange(n,n)}catch(_){}}}});
function go(v){
  if(VIEWS.indexOf(v)<0)return;try{sessionStorage.setItem("mf-view",v)}catch(e){}
  hideTip();const changed=v!==UI.view;if(changed)enterView(v);UI.modal=null;render();if(changed)window.scrollTo(0,0);
  try{if(location.hash!=="#"+v)history.replaceState(null,"","#"+v)}catch(e){}
}
/* intercepta todo link interno (#aba): funciona até em prévias que bloqueiam a troca de endereço */
document.addEventListener("click",e=>{
  const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;
  const v=a.getAttribute("href").slice(1);if(VIEWS.indexOf(v)<0)return;
  e.preventDefault();setTimeout(()=>go(v),0);
},true);
window.addEventListener("hashchange",()=>{const v=viewFromHash();try{sessionStorage.setItem("mf-view",v)}catch(e){}if(v===UI.view)return;enterView(v);render();window.scrollTo(0,0)});

/* tooltip */
const tip=document.getElementById("tip");
function showTip(el,x,y){tip.innerHTML=el.dataset.tip;tip.style.display="block";const r=tip.getBoundingClientRect();let L=x+14,T=y+14;if(L+r.width>innerWidth-8)L=x-r.width-14;if(T+r.height>innerHeight-8)T=y-r.height-14;tip.style.left=Math.max(8,L)+"px";tip.style.top=Math.max(8,T)+"px"}
function hideTip(){tip.style.display="none"}
document.addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;const el=e.target.closest&&e.target.closest("[data-tip]");if(el)showTip(el,e.clientX,e.clientY);else hideTip()});
document.addEventListener("pointerdown",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el&&e.pointerType==="touch")showTip(el,e.clientX,e.clientY-60);else if(!el)hideTip()});
document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el){const r=el.getBoundingClientRect();showTip(el,r.left+r.width/2,r.bottom)}else hideTip()});
window.addEventListener("scroll",hideTip,{passive:true});

function resumoAuto(){const P=addM(CUR,-1);if(S.exemplo||S.resumoVisto===P||TODAY.getDate()>15)return;const d=monthData(P);if(!(d.D>0||d.R>0))return;UI.modal={type:"resumo",X:P};S.resumoVisto=P;scheduleSave(3000)}
try{UI.priv=localStorage.getItem("mf-priv")==="1"}catch(_){}
let booted=false;
/* ---------- modo demonstração (dados fictícios, nada é salvo) ---------- */
let REAL=null;
function demoOn(silent){if(UI.demo)return;if(UI.dirty){toast("Salve ou descarte as alterações antes");return}REAL=S;S=makeDefault();normalize(S);S.exemplo=true;MEMO={};UI.draft=null;UI.demo=true;UI.modal=null;try{localStorage.setItem("mf-demo","1")}catch(_){}setStatus("demo");render();if(!silent)toast("Modo demonstração: dados fictícios. Seus dados continuam guardados.")}
function demoOff(){if(!UI.demo)return;if(REAL)S=REAL;REAL=null;MEMO={};UI.draft=null;UI.dirty=false;UI.demo=false;UI.modal=null;try{localStorage.removeItem("mf-demo")}catch(_){}setStatus(FH&&FHperm==="granted"?"savedfile":"savedlocal");render();gdQueue(500);toast("De volta aos seus dados")}
function afterUnlock(){if(booted)return;booted=true;let demo0=false;try{demo0=localStorage.getItem("mf-demo")==="1"}catch(_){}if(!demo0)resumoAuto();root.classList.add("intro");render();setTimeout(()=>root.classList.remove("intro"),700);
  if(LOCAL){initFile().then(()=>fetchMercado(false)).then(()=>checarPregao());setInterval(()=>{checarPregao()},60000)}
  if(GDRET&&GDRET.err&&gdCfg().on){GD.state="needlogin";if(GDRET.err!=="interaction_required"&&GDRET.err!=="login_required"&&GDRET.err!=="consent_required")toast("Não foi possível entrar no Google ("+GDRET.err+")")}
  if(GDRET&&GDRET.ok)toast("Conectado ao Google Drive");
  if(demo0)demoOn(true);
  gdQueue(GDRET&&GDRET.ok?300:1200);setInterval(()=>{if(document.visibilityState==="visible")gdQueue(0)},120000);
  window.addEventListener("online",()=>gdQueue(500))}
if(window.__gdSilent){root.innerHTML='<div class="lockscr"><div class="lockbox"><span class="logo lg">'+ic("wallet")+'</span><p class="sub">Conectando ao Google…</p></div></div>'}
else if(LOCKED){restoreStashedKey().then(ok=>{if(ok){LOCKED=false;afterUnlock()}else render()})}
else afterUnlock();
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
})();
</script>
